# 基督教内容平台 — VPS 一键部署（全 Docker，宿主机零依赖）
# 用法:
#   1) cp deploy/env.example .env  然后填好 DB_PASSWORD / JWT_SECRET / DOMAIN
#   2) docker compose up -d --build
#   3) 浏览器访问 http://<VPS_IP>   （先用 IP 验证；有域名再跑 certbot 上 HTTPS）
#
# 架构: nginx(80/443) -> web(3000) -> db(3306) 全部在 Docker 内网，互不暴露公网。

services:
  db:
    image: mysql:8.0
    container_name: cp_db
    restart: unless-stopped
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-change-me-now}
      MYSQL_DATABASE: ${DB_NAME:-christian_platform}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      # 用 MYSQL_ROOT_PASSWORD 环境变量，避免 compose 二次转义问题
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s

  web:
    build: .
    container_name: cp_web
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      mediamtx:
        condition: service_started
    environment:
      DB_HOST: db          # 容器内用服务名访问
      DB_PORT: "3306"
      DB_USER: root
      DB_PASSWORD: ${DB_PASSWORD:-change-me-now}
      DB_NAME: ${DB_NAME:-christian_platform}
      JWT_SECRET: ${JWT_SECRET:-please-set-a-long-random-secret}
      PORT: "3000"
      # 直播：控制 API 走内网 mediamtx:9997；公网推流地址用域名
      MEDIAMTX_API: http://mediamtx:9997
      MEDIAMTX_PUBLIC_HOST: ${MEDIAMTX_PUBLIC_HOST:-${DOMAIN:-localhost}}
      MEDIAMTX_HLS_VIA_PROXY: "true"
      MEDIAMTX_USER: ${MEDIAMTX_USER:-admin}
      MEDIAMTX_PASS: ${MEDIAMTX_PASS:-admin}
      # NODE_ENV 由 server.js --prod 设置，无需在此覆盖
    expose:
      - "3000"             # 只给 nginx 用，不映射到宿主机

  nginx:
    image: nginx:1.27-alpine
    container_name: cp_nginx
    restart: unless-stopped
    depends_on:
      - web
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/certs:/etc/nginx/certs:ro   # 证书目录；无 HTTPS 时为空即可

  # 直播媒体服务器：RTMP 推流(1935) + HLS 播放(8888) + WebRTC(8889) + 控制 API(9997)
  # 1935/8889 直连公网（OBS/手机推流、WebRTC 必须直连端口）；
  # 8888 HLS 不暴露公网，由 nginx 443 反代到 /hls/，保证浏览器全程 HTTPS。
  mediamtx:
    image: bluenviron/mediamtx:latest
    container_name: cp_mediamtx
    restart: unless-stopped
    # 用镜像内置默认配置 + 环境变量覆盖即可，不挂载自定义 yml：
    # MediaMTX 配置是「扁平式」(api/rtmpAddress/hlsAddress...)，不是嵌套式，
    # 手写 yml 极易因字段名/类型不对导致启动失败。环境变量 MTX_<字段名大写> 最稳。
    # 默认 RTMP 1935 / HLS 8888 / WebRTC 8889 已与应用代码对齐，无需覆盖。
    # 关键：API 默认关闭(api: false)，必须显式开启，否则 web 容器管理直播会失败。
    environment:
      MTX_API: "true"
      MTX_APIADDRESS: ":9997"   # 监听全部网卡，供 web/nginx 跨容器访问（默认即为 :9997）
      MTX_LOGLEVEL: info
    ports:
      - "1935:1935"   # RTMP 推流
      - "8889:8889"   # WebRTC 播放
      - "9997:9997"   # 控制 API（仅内网给 web 用；映射到宿主机便于 curl 排障）
    expose:
      - "8888"        # HLS 只给 nginx 反代用，不暴露公网

volumes:
  db_data:
