# 基督教内容平台 — VPS 一键部署（全 Docker，宿主机零依赖）
# 用法:
#   1) cp deploy/env.example .env  然后填好 DB_PASSWORD / JWT_SECRET / DOMAIN
#   2) docker compose up -d --build
#   3) 浏览器访问 http://<VPS_IP>   （先用 IP 验证；有域名再跑 certbot 上 HTTPS）
#
# 架构: nginx(80/443) -> web(3000) -> db(3306) 全部在 Docker 内网，互不暴露公网。

services:
  db:
    image: mysql:8.0
    container_name: cp_db
    restart: unless-stopped
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-change-me-now}
      MYSQL_DATABASE: ${DB_NAME:-christian_platform}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      # 用 MYSQL_ROOT_PASSWORD 环境变量，避免 compose 二次转义问题
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s

  web:
    build: .
    container_name: cp_web
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      mediamtx:
        condition: service_started
    environment:
      DB_HOST: db          # 容器内用服务名访问
      DB_PORT: "3306"
      DB_USER: root
      DB_PASSWORD: ${DB_PASSWORD:-change-me-now}
      DB_NAME: ${DB_NAME:-christian_platform}
      JWT_SECRET: ${JWT_SECRET:-please-set-a-long-random-secret}
      PORT: "3000"
      # 直播：控制 API 走内网 mediamtx:9997；公网推流地址用域名
      # 注意：域名一旦开启 Cloudflare 代理(橙云)，解析出来的是 CF 的 IP，
      # 而 CF 只代理 HTTP(S) 端口，RTMP(8080) 与 WebRTC(8889) 会直接连不上。
      # 因此推流必须用「灰云(DNS only)」子域，例如 rtmp.amen.dpdns.org，
      # 指向同一个服务器 IP，然后在这里设置 MEDIAMTX_PUBLIC_HOST=rtmp.amen.dpdns.org。
      MEDIAMTX_API: http://mediamtx:9997
      # 推流主机：必须「灰云(DNS only)」，RTMP 是裸 TCP、CF 只代理 HTTP(S)，橙云会连不上。
      MEDIAMTX_PUBLIC_HOST: ${MEDIAMTX_PUBLIC_HOST:-${DOMAIN:-localhost}}
      # 播放主机：观众走 HTTPS 443 的 /hls/，由 nginx 反代，可以放心用橙云主域。
      # 推流域名与播放域名不同时必须显式设它，否则播放地址会落到灰云域名上
      # （自签/证书不匹配 → 观众黑屏）。默认跟随 DOMAIN。
      MEDIAMTX_HLS_HOST: ${MEDIAMTX_HLS_HOST:-${DOMAIN:-localhost}}
      MEDIAMTX_HLS_VIA_PROXY: "true"
      # RTMP 推流端口，需与 deploy/mediamtx.yml 的 rtmpAddress、上方 mediamtx 端口映射一致
      MEDIAMTX_RTMP_PORT: "8080"
      MEDIAMTX_USER: ${MEDIAMTX_USER:-admin}
      MEDIAMTX_PASS: ${MEDIAMTX_PASS:-admin}
      # 直播录像目录：必须与 mediamtx 的 recordPath(/recordings) 挂载同一个宿主机目录，
      # 否则 web 容器读不到 mediamtx 写出的录像，页面会一直卡在「录像生成中」。
      RECORD_DIR: /recordings
      # 服务端语音合成（朗读兜底）。默认 auto：先试微软 Edge TTS，失败自动降级百度 TTS。
      # 国内机房直连微软 TTS 常不通，可设 TTS_PROVIDER=baidu 直接走百度，
      # 或设 TTS_PROXY=http://user:pass@host:port 让 Edge 走代理出境。
      # 部署后可访问 /api/v1/bible/tts?diag=1 查看各合成源的连通性与耗时。
      TTS_PROVIDER: ${TTS_PROVIDER:-auto}
      TTS_PROXY: ${TTS_PROXY:-}
      # 站点对外地址：影响 sitemap.xml / robots.txt / og:image 的绝对地址
      SITE_URL: ${SITE_URL:-https://amen.dpdns.org}
      # 支付网关密钥：优先在「后台 → 支付配置」页面填写（AES 加密存库、即时生效）。
      # 下面这些 .env 变量仅作兜底——后台已配置则无需在此重复填。
      ALIPAY_APP_ID: ${ALIPAY_APP_ID:-}
      ALIPAY_PRIVATE_KEY: ${ALIPAY_PRIVATE_KEY:-}
      ALIPAY_PUBLIC_KEY: ${ALIPAY_PUBLIC_KEY:-}
      WECHAT_MCHID: ${WECHAT_MCHID:-}
      WECHAT_API_V3_KEY: ${WECHAT_API_V3_KEY:-}
      WECHAT_PRIVATE_KEY: ${WECHAT_PRIVATE_KEY:-}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      # 密钥加密主密钥：用于 AES-256-GCM 加密落库的支付密钥。
      # 部署前务必设一个长随机值；一旦设置后不要随意更换（换了旧密文解不开）。
      SETTINGS_SECRET: ${SETTINGS_SECRET:-}
      # NODE_ENV 由 server.js --prod 设置，无需在此覆盖
    volumes:
      - ./data/recordings:/recordings   # 与 mediamtx 共享录像目录
      - ./data/uploads:/app/public/uploads   # 用户头像等静态上传,重建容器不丢
    expose:
      - "3000"             # 只给 nginx 用，不映射到宿主机

  nginx:
    image: nginx:1.27-alpine
    container_name: cp_nginx
    restart: unless-stopped
    depends_on:
      # nginx 用 proxy_pass http://mediamtx:8888，启动时必须能解析到该主机，
      # 否则会报 "host not found in upstream" 而启动失败 —— 故显式依赖。
      - web
      - mediamtx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/certs:/etc/nginx/certs:ro   # 证书目录；无 HTTPS 时为空即可

  # 直播媒体服务器：RTMP 推流(1935) + HLS 播放(8888) + WebRTC(8889) + 控制 API(9997)
  # 1935/8889 直连公网（OBS/手机推流、WebRTC 必须直连端口）；
  # 8888 HLS 不暴露公网，由 nginx 443 反代到 /hls/，保证浏览器全程 HTTPS。
  mediamtx:
    image: bluenviron/mediamtx:latest
    container_name: cp_mediamtx
    restart: unless-stopped
    # 配置用 deploy/mediamtx.yml（基于 MediaMTX 官方默认配置生成，只改了 api 开关 + 管理员 IP 白名单）。
    # MediaMTX 是「扁平式」配置(api / rtmpAddress / hlsAddress...)，切勿手写字段名：
    # 类型写错(如 api 写成对象) → cannot unmarshal object into bool → 容器反复重启。
    # 另：API 默认关闭、默认只允许 127.0.0.1 调用，两处都已在配置文件里放开。
    volumes:
      - ./deploy/mediamtx.yml:/mediamtx.yml:ro
      - ./data/recordings:/recordings   # 录像落盘；与 web 容器共享（web 侧 RECORD_DIR=/recordings）
    ports:
      - "8080:8080"   # RTMP 推流（避开 1935：明文 RTMP 握手在该端口易被识别丢包）
      - "8889:8889"   # WebRTC 播放
      - "9997:9997"   # 控制 API（仅内网给 web 用；映射到宿主机便于 curl 排障）
    expose:
      - "8888"        # HLS 只给 nginx 反代用，不暴露公网

volumes:
  db_data:
