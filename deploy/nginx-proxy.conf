# 放到 /etc/nginx/sites-available/christian-platform，再 ln -s 到 sites-enabled
# 域名换成你的；证书用 certbot 生成后自动套用
#
# 需要在 /etc/nginx/nginx.conf 的 http{} 里加一行(不在 server 里):
#   proxy_cache_path /var/cache/nginx/platform levels=1:2 keys_zone=platform:10m max_size=256m inactive=10m use_temp_path=off;
# 并创建目录: mkdir -p /var/cache/nginx/platform && chown www-data:www-data /var/cache/nginx/platform

server {
    listen 80;
    server_name your-domain.com;        # ← 改成你的域名
    # certbot 申请证书时需要临时放行
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    server_name your-domain.com;        # ← 改成你的域名

    ssl_certificate     /etc/letsencrypt/live/your-domain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/your-domain.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;             # 减少重复 TLS 握手(弱网/高延迟下收益明显)

    client_max_body_size 0;             # 媒体上传按需放开，0=不限制(注意安全)

    # 压缩:弱网下最直接的提速手段
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml application/json application/javascript
               application/xml+rss application/atom+xml image/svg+xml font/ttf font/woff2;

    # 静态资源(带 hash 的 JS/CSS):长缓存 + 跳过访问日志
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_cache platform;
        proxy_cache_valid 200 30d;
        proxy_cache_use_stale error timeout updating;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Cache-Status $upstream_cache_status;
        access_log off;
    }

    location /sw.js {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # 首页:匿名 GET 做 60s 微缓存,命中后不经 Node,TTFB 降到毫秒级
    location = / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 120s;
        proxy_cache platform;
        proxy_cache_key "$scheme$host$request_uri";
        proxy_cache_methods GET HEAD;
        proxy_cache_valid 200 60s;
        # Next 的 SSR 响应默认带 Cache-Control: private/no-store,
        # 不忽略的话 nginx 不会缓存;首页是公开内容,微缓存 60s 是安全的。
        proxy_ignore_headers Cache-Control Expires Set-Cookie;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503;
        proxy_cache_lock on;             # 缓存过期时只放行一个回源请求
        add_header X-Cache-Status $upstream_cache_status;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # WebSocket（直播 /ws 实时通道）需要升级头
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 120s;
    }
}
