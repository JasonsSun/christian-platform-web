# nginx 容器内配置（挂到 /etc/nginx/conf.d/default.conf）
# 域名：amen.dpdns.org
# 架构：Cloudflare(橙云) -> 本 nginx(443, CF Origin 证书) -> web:3000
#
# 关键修复：
#   web / mediamtx 容器可能被单独 rebuild（如只 `docker compose up -d --build web`），
#   重建后容器 IP 改变。若 nginx 用静态 `server web:3000`，nginx 只在启动/reload 时解析一次，
#   之后一直连旧 IP -> 全站 502。故改用 Docker 内置 DNS(127.0.0.11) 变量式 proxy_pass，
#   让 nginx 每次连接都重新解析服务名，根治「只 rebuild web 就 502」。
#
# CDN 相关（2026-09-14）：
#   域名已托管在 Cloudflare，但 A 记录此前是「仅 DNS(灰云)」，访客直连香港源站，
#   跨境丢包导致 TTFB 1~16s。把记录改成「已代理(橙云)」后，握手发生在 CF 边缘。
#   配套三点：① 源站发 s-maxage 让 CDN 能缓存公开页面；② 取真实 IP(否则 IP 限流连坐)；
#   ③ 直播 /hls、API、后台等私有/实时路径一律 no-store。

# WebSocket 升级头映射
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Docker 内置 DNS：每次连接重解析服务名，避免容器重建后 upstream 指向旧 IP
resolver 127.0.0.11 valid=10s ipv6=off;

# HTTP：统一跳 HTTPS（Cloudflare 回源走 443，此处兜底）
server {
    listen 80;
    server_name amen.dpdns.org _;

    # 保留 CF 的 acme 路径（如后续改用 Let's Encrypt 可复用）
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    http2 on;
    server_name amen.dpdns.org _;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    client_max_body_size 2g;      # 媒体上传（视频/音频）放宽，按需调整

    proxy_http_version 1.1;
    proxy_connect_timeout 5s;
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;

    # ---------- CDN 后取真实客户端 IP ----------
    # 不做这一步，应用看到的全是 CF 节点 IP，注册/登录的 IP 限流（5 次/10 分钟）
    # 会把所有访客当成同一个人互相连坐。
    # 维护：curl https://www.cloudflare.com/ips-v4 与 ips-v6 定期更新下面两段。
    real_ip_header CF-Connecting-IP;
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;
    set_real_ip_from 2400:cb00::/32;
    set_real_ip_from 2606:4700::/32;
    set_real_ip_from 2803:f800::/32;
    set_real_ip_from 2405:b500::/32;
    set_real_ip_from 2405:8100::/32;
    set_real_ip_from 2a06:98c0::/29;
    set_real_ip_from 2c0f:f248::/32;

    # 启用压缩：HTML/JS/CSS/字体/SVG 走 gzip，直连或 Cloudflare 灰云场景也能减负
    # （Cloudflare 橙云会再压一次，对已压缩的不重复压，无副作用）
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript application/xml text/xml image/svg+xml font/woff2;

    # 变量式 upstream：配合上方 resolver，web/mediamtx 重建后无需 restart nginx
    set $web_upstream http://web:3000;
    set $mtx_upstream http://mediamtx:8888;

    # ---------- 私有/实时：一律不缓存 ----------
    location /api/ {
        proxy_pass $web_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "no-store";
    }

    location ~ ^/(admin|me|messages|settings|notifications|login|register|confirm|wechat)(/|$) {
        proxy_pass $web_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "no-store";
    }

    # ---------- 公开页面：CDN 缓存 60s ----------
    # s-maxage 只对共享缓存(CDN)生效，浏览器仍每次请求；页面 HTML 不含个性化内容
    # （登录 token 在 localStorage），缓存是安全的。
    location / {
        proxy_pass $web_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket（直播 /ws 实时通道）必须升级
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # 关键：必须先隐藏上游(Next)自己的 Cache-Control，否则两个头拼在一起
        # 变成 "private, no-cache, no-store, ... , public, s-maxage=60"，
        # Cloudflare 见到 no-store 直接放弃缓存(实测 cf-cache=DYNAMIC)，CDN 白接。
        proxy_hide_header Cache-Control;
        add_header Cache-Control "public, max-age=0, s-maxage=60, stale-while-revalidate=300";
    }

    # 构建产物:文件名带内容 hash,永久不变,长缓存加速首屏
    location /_next/static/ {
        proxy_pass $web_upstream;
        proxy_set_header Host $host;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # 直播 HLS 播放：去掉 /hls 前缀后转发 MediaMTX :8888（浏览器全程 HTTPS）
    location /hls/ {
        # 变量式 proxy_pass 不能用 URI 后缀，用 rewrite 去掉 /hls 前缀，
        # 等价原 `proxy_pass http://mediamtx:8888/`（/hls/live/<key>/.. -> /live/<key>/..）
        rewrite ^/hls/(.*)$ /$1 break;
        proxy_pass $mtx_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_http_version 1.1;
        proxy_read_timeout 60s;
        # HLS 分段用 chunked 流式下发，关闭缓冲
        proxy_buffering off;
        # 必须 no-store：直播分片 URL 会随时间滚动复用，任何一层缓存（浏览器/CDN）
        # 都可能让观众看到几十秒前的内容，表现为"一直在重复之前说过的话"
        add_header Cache-Control "no-store, no-cache, must-revalidate";

        # MediaMTX 会话探测会返回「相对路径」Location(如 /live/<key>/index.m3u8?cookieCheck=1)。
        # nginx 默认不改写相对 Location，浏览器会跳到 /live/... (平台页面路由) 导致 404。
        # 这里统一补上 /hls 前缀；应用侧已在播放地址带上 ?cookieCheck=1 跳过该重定向，此处为兜底。
        proxy_redirect / /hls/;
    }
}
