# nginx 容器内配置（挂到 /etc/nginx/conf.d/default.conf）
# 域名：amen.dpdns.org
# 架构：Cloudflare(橙云) -> 本 nginx(443, CF Origin 证书) -> web:3000

upstream cp_web {
    server web:3000;
    keepalive 32;
}

# WebSocket 升级头映射
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# HTTP：统一跳 HTTPS（Cloudflare 回源走 443，此处兜底）
server {
    listen 80;
    server_name amen.dpdns.org _;

    # 保留 CF 的 acme 路径（如后续改用 Let's Encrypt 可复用）
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    http2 on;
    server_name amen.dpdns.org _;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    client_max_body_size 2g;      # 媒体上传（视频/音频）放宽，按需调整

    proxy_http_version 1.1;
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;

    location / {
        proxy_pass http://cp_web;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket（直播 /ws 实时通道）必须升级
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}
