<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<title>OG 分享卡设计稿</title>
<style>
  /* 与 /api/og 的 ImageResponse 布局保持一致，用作本地预览与设计稿复现。
     渲染命令（Windows）：
     chrome --headless=new --disable-gpu --no-sandbox --hide-scrollbars \
       --force-device-scale-factor=1 --window-size=1200,630 \
       --screenshot=scripts/og-card-sample.png scripts/og-card.html */
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    font-family: 'DengXian', 'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .card {
    position: relative;
    width: 1200px; height: 630px;
    padding: 62px 72px;
    display: flex; flex-direction: column;
    background: linear-gradient(135deg, #1e2664 0%, #3d52d9 55%, #4f6df5 100%);
    color: #fff; overflow: hidden;
  }
  .blob-a {
    position: absolute; right: -130px; top: -150px;
    width: 480px; height: 480px; border-radius: 50%;
    background: rgba(251, 191, 36, 0.16);
  }
  .blob-b {
    position: absolute; left: -110px; bottom: -170px;
    width: 430px; height: 430px; border-radius: 50%;
    background: rgba(255, 255, 255, 0.06);
  }
  .top { display: flex; align-items: center; justify-content: space-between; position: relative; }
  .brand { display: flex; align-items: center; }
  .mark {
    width: 46px; height: 46px; border-radius: 13px;
    background: #fbbf24; color: #1e2664;
    font-size: 28px; font-weight: 700;
    display: flex; align-items: center; justify-content: center;
    margin-right: 16px;
  }
  .name { font-size: 27px; font-weight: 700; letter-spacing: 1px; }
  .pill {
    font-size: 21px; padding: 9px 22px; border-radius: 999px;
    background: rgba(255, 255, 255, 0.16);
    border: 1px solid rgba(255, 255, 255, 0.28);
  }
  .body { position: relative; flex: 1; display: flex; flex-direction: column; justify-content: center; padding-right: 40px; }
  .title { font-size: 64px; font-weight: 700; line-height: 1.34; letter-spacing: 0.5px; }
  .sub { margin-top: 26px; font-size: 28px; line-height: 1.6; color: rgba(255, 255, 255, 0.82); }
  .foot { position: relative; display: flex; align-items: center; justify-content: space-between; }
  .foot div { font-size: 23px; color: rgba(255, 255, 255, 0.72); }
</style>
</head>
<body>
  <div class="card">
    <div class="blob-a"></div>
    <div class="blob-b"></div>
    <div class="top">
      <div class="brand">
        <div class="mark">约</div>
        <div class="name">圣约社区</div>
      </div>
      <div class="pill">圣经</div>
    </div>
    <div class="body">
      <div class="title">耶和华是我的牧者，我必不至缺乏</div>
      <div class="sub">他使我躺卧在青草地上，领我在可安歇的水边。他使我的灵魂苏醒，为自己的名引导我走义路。</div>
    </div>
    <div class="foot">
      <div>诗篇 23:1 · 和合本</div>
      <div>amen.dpdns.org</div>
    </div>
  </div>
</body>
</html>
