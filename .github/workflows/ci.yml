name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: apps/web/package-lock.json

      - name: 安装依赖
        working-directory: apps/web
        run: npm ci

      - name: 类型检查
        working-directory: apps/web
        run: npx tsc --noEmit -p tsconfig.json

      - name: 生产构建
        working-directory: apps/web
        env:
          # 构建期不需要真实密钥，但 auth.ts 在生产模式下会校验长度 ≥32
          JWT_SECRET: ci-only-placeholder-secret-at-least-32-chars
          NEXT_TELEMETRY_DISABLED: '1'
        run: npm run build

      - name: 单元测试（安全扫描 / 读经计划判定）
        working-directory: apps/web
        run: |
          npm test
          npm run test:plan

  e2e:
    needs: check
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: testpass
          MYSQL_DATABASE: christian_platform
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -ptestpass"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      DB_HOST: 127.0.0.1
      DB_PORT: '3306'
      DB_USER: root
      DB_PASSWORD: testpass
      DB_NAME: christian_platform
      JWT_SECRET: ci-e2e-secret-at-least-32-chars-long

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: apps/web/package-lock.json

      - name: 安装依赖
        working-directory: apps/web
        run: npm ci

      - name: 真实环境 e2e（建库 → 迁移 → 起服务 → 全量回归）
        working-directory: apps/web
        run: bash scripts/ci-e2e.sh
