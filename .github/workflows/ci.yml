name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: apps/web/package-lock.json

      - name: 安装依赖
        working-directory: apps/web
        run: npm ci

      - name: 类型检查
        working-directory: apps/web
        run: npx tsc --noEmit -p tsconfig.json

      - name: 生产构建
        working-directory: apps/web
        env:
          # 构建期不需要真实密钥，但 auth.ts 在生产模式下会校验长度 ≥32
          JWT_SECRET: ci-only-placeholder-secret-at-least-32-chars
          NEXT_TELEMETRY_DISABLED: '1'
        run: npm run build

      - name: 单元测试（安全扫描 / 读经计划判定）
        working-directory: apps/web
        run: |
          npm test
          npm run test:plan

      # e2e 脚本需要真实服务 + MySQL + 种子账号，CI 里跑不稳，
      # 保留在本地/CI 手动触发：npm run test:e2e:sermons 等 18 个脚本。
      # 如需接入，可加 mysql service 后：
      #   npm run migrate && npm start & npx wait-on http://127.0.0.1:3000
      #   再逐个跑 scripts/e2e-*.mjs
